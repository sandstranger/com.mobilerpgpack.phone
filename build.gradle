// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.versions = [
            app_package_name : "com.mobilerpgpack.phone",
            app_version_code : 48,
            app_version_name : "3.0.0",
            min_sdk : 24,
            target_sdk : 36,
            ndk_version : '29.0.14206865',
            build_tools_version : '36.1.0',
            native_android_platform_version : 24,
            cmake_version : "4.1.2"
    ]
    ext.build_flags = [
            compiling_arguments : "-j${Runtime.getRuntime().availableProcessors()}",
            common_c_flags : ["-Os","-flto=full", "-fno-omit-frame-pointer","-funwind-tables", "-g"],
            common_cpp_flags : ["-Os" ,"-flto=full", "-fno-omit-frame-pointer","-funwind-tables", "-g"],
            ndk_build_flags : "APP_LDFLAGS=-fuse-ld=lld -flto=full -Wl,--build-id",
            ndk_build_android_stl : "APP_STL=c++_shared",
            CMAKE_CFLAGS : "-Os -flto=full -fno-omit-frame-pointer -funwind-tables -g",
            CMAKE_CXXFLAGS : "-Os -flto=full -fno-omit-frame-pointer -funwind-tables -g",
            CMAKE_ANDROID_STL : "-DANDROID_STL=c++_shared",
            CMAKE_SHADERLINKER_FLAGS :"-flto=full -fuse-ld=lld -Wl,--build-id",
            ndk_build_platform : "APP_PLATFORM=android-${versions.native_android_platform_version}"
    ]
    ext.abi_filters = ['armeabi-v7a','arm64-v8a',"x86","x86_64"]
    ext.rootDir = rootProject.rootDir
    repositories {
        google()
    }
    dependencies {
        classpath libs.google.services
        classpath(libs.kotlin.gradle.plugin)
    }
}


plugins {
alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
}