#### Environment Variable Information ####
#
# . references the current directory that UZDoom is launched from within
# your terminal or console.
#
# $DOOMWADDIR references a system environment variable of the same name
# that contains a search directory.
#
# $DOOMWADPATH references a system environment variable of the same name
# whose value contains a colon delimited list of searchable directories.
# It's *similar* to $DOOMWADDIR, except that $DOOMWADPATH is a list of
# possible search directories.
#
# $HOME references your system user directory.
#
# $PROGDIR references the directory that the main binary is located.
#
# For more information and examples of how to use environment variables,
# please see: https://zdoom.org/wiki/Configuration_file#Environment_Variables
#
####

# These are the directories to automatically search for IWADs.
# Each directory should be on a separate line, preceded by Path=
[IWADSearch.Directories]
Path=$DOOMWADDIR

# These are the directories to search for wads added with the -file
# command line parameter, if they cannot be found with the path as-is.
# Layout is the same as for IWADSearch.Directories
[FileSearch.Directories]
Path=$DOOMWADDIR

# These are the directories to search for soundfonts that let listed in the menu.
# Layout is the same as for IWADSearch.Directories
[SoundfontSearch.Directories]
Path=$PROGDIR/soundfonts
Path=$PROGDIR/fm_banks

# Files to automatically execute when running the corresponding game.
# Each file should be on its own line, preceded by Path=

[Doom.AutoExec]

