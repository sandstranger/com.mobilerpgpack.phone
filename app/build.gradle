//file:noinspection ConfigurationAvoidance
import com.google.gms.googleservices.GoogleServicesPlugin
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    id 'com.google.devtools.ksp' version '2.3.9'
    id("com.google.gms.google-services")
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
    id("com.google.firebase.crashlytics") version "3.0.7"
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('release-keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.mobilerpgpack.phone'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include("arm64-v8a")
            universalApk false
        }
    }

    flavorDimensions "store"
    productFlavors {
        google {
            dimension "store"
            versionName "${versions.app_version_name}"
        }
        fdroid {
            dimension "store"
            versionName "${versions.app_version_name}"
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }

    googleServices {
        disableVersionCheck = true
        missingGoogleServicesStrategy = GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId versions.app_package_name
        minSdk versions.min_sdk
        targetSdk versions.target_sdk
        versionCode versions.app_version_code

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-${versions.native_android_platform_version}",
                        "-DCMAKE_CXX_FLAGS=${build_flags.CMAKE_CXXFLAGS} -fno-builtin -U_FORTIFY_SOURCE -fno-delete-null-pointer-checks " +
                                "-fno-strict-aliasing -Wno-c++11-narrowing -Wno-format-security -w",
                        "-DCMAKE_C_FLAGS=${build_flags.CMAKE_CFLAGS} -fno-builtin -U_FORTIFY_SOURCE -fno-delete-null-pointer-checks " +
                                "-fno-strict-aliasing -Wno-format-security -w",
                        "-DCMAKE_SHARED_LINKER_FLAGS=${build_flags.CMAKE_SHADERLINKER_FLAGS} -Wl,--allow-shlib-undefined",
                        "-DANDROID_ARM_MODE=arm", "${build_flags.CMAKE_ANDROID_STL}", "-D_FILE_OFFSET_BITS=64"
            }
        }
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                def appName = "Classic_Core"
                def versionName = versions.app_version_name
                def versionCode = versions.app_version_code
                def buildType = variant.buildType
                def flavor = variant.productFlavors.collect { it.second }.join("_")
                if (!flavor) flavor = "noflavor"
                def date = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyy_MM_dd_HH_mm"))
                def abiFilter = output.filters.find { it.filterType.name() == 'ABI' }
                def abi = abiFilter ? abiFilter.identifier : null
                def abiPart = abi ? "_${abi}" : "_universal"
                output.outputFileName.set(
                        "${appName}_${flavor}_${buildType}${abiPart}_v${versionName}_b${versionCode}_${date}.apk"
                )
            }

            if (variant.buildType == "release" && variant.name.contains("google")) {
                def variantName = variant.name.capitalize()
                def assembleTaskName = "assemble${variantName}"
                def uploadSymbolsTaskName = "uploadCrashlyticsSymbolFile${variantName}"

                project.afterEvaluate {
                    def assembleTask = tasks.findByName(assembleTaskName)
                    def uploadSymbolsTask = tasks.findByName(uploadSymbolsTaskName)

                    if (assembleTask && uploadSymbolsTask) {
                        assembleTask.finalizedBy(uploadSymbolsTask)
                        println "SUCCESS: Task '${uploadSymbolsTask.name}' will run after '${assembleTask.name}'"
                    } else {
                        logger.warn("Tasks not found: ${assembleTaskName} or ${uploadSymbolsTaskName}")
                    }
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "$rootProject.rootDir/CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }
            ndk {
                debugSymbolLevel 'FULL'
                abiFilters.clear()
            }
        }
        debug {
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
            ndk {
                abiFilters.clear()
            }
            signingConfig signingConfigs.debug
        }

        afterEvaluate {
            def assetDir = file("src/main/assets")
            if (assetDir.exists()) {
                def noExtFiles = []
                assetDir.eachFileRecurse { file ->
                    if (file.isFile() && !file.name.contains('.')) {
                        noExtFiles.add(file.name)
                    }
                }
                if (!noExtFiles.empty) {
                    android.aaptOptions.noCompress += noExtFiles.unique()
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
        viewBinding true
        prefab true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
}

preBuild.dependsOn ':third_party:fluidsynth:build',':machine_translator:CTranslate2Proxy:build',
        ':machine_translator:Translator:build',
