plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.mobilerpgpack.libsndfile'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        ndk {
            abiFilters = abi_filters
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DCMAKE_CXX_FLAGS=$build_flags.CMAKE_CXXFLAGS",
                        "-DCMAKE_C_FLAGS=$build_flags.CMAKE_CFLAGS",
                        "-DCMAKE_SHARED_LINKER_FLAGS=$build_flags.CMAKE_SHADERLINKER_FLAGS",
                        "-DBUILD_PROGRAMS=OFF","-DBUILD_EXAMPLES=OFF",
                        "-DENABLE_CPACK=OFF", "-DENABLE_PACKAGE_CONFIG=OFF",
                        "-DINSTALL_PKGCONFIG_MODULE=OFF", "-DBUILD_SHARED_LIBS=ON",
                        "-DBUILD_TESTING=OFF", "-DENABLE_EXTERNAL_LIBS=ON",
                        "-DENABLE_MPEG=ON",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "$build_flags.CMAKE_ANDROID_STL","-DANDROID_ARM_MODE=arm","-D_FILE_OFFSET_BITS=64"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.dependsOn ':third_party:libvorbis:build',':third_party:flac:build',
        ':third_party:opus:build',':third_party:mpg123:build',':third_party:libmp3lame:build',
        ':third_party:ogg:build'

dependencies {
    implementation(project(":third_party:libvorbis"))
    implementation(project(":third_party:ogg"))
    implementation(project(":third_party:flac"))
    implementation(project(":third_party:opus"))
    implementation(project(":third_party:mpg123"))
    implementation(project(":third_party:libmp3lame"))
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}