plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.mobilerpgpack.sdl2_compat'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include("arm64-v8a")
            universalApk false
        }
    }

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DBUILD_SHARED_LIBS=true",
                        "-DCMAKE_CXX_FLAGS=$build_flags.CMAKE_CXXFLAGS",
                        "-DCMAKE_C_FLAGS=$build_flags.CMAKE_CFLAGS",
                        "-DSDL2COMPAT_X11=OFF", "-DSDL2COMPAT_TESTS=OFF",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=$build_flags.CMAKE_SHADERLINKER_FLAGS",
                        "$build_flags.CMAKE_ANDROID_STL","-DANDROID_ARM_MODE=arm","-D_FILE_OFFSET_BITS=64"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.dependsOn ':third_party:sdl3:android-project:app:build'

dependencies {
    implementation(project(":third_party:sdl3:android-project:app"))
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}