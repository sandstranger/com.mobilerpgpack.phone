plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.mobilerpgpack.ogg'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include("arm64-v8a")
            universalApk false
        }
    }

    defaultConfig {
        targetSdk versions.target_sdk
        minSdk versions.min_sdk
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DBUILD_SHARED_LIBS=ON", "-DBUILD_TESTING=OFF",
                        "-DINSTALL_DOCS=OFF","-DINSTALL_PKG_CONFIG_MODULE=OFF",
                        "-DINSTALL_CMAKE_PACKAGE_MODULE=OFF",
                        "-DCMAKE_CXX_FLAGS=$build_flags.CMAKE_CXXFLAGS",
                        "-DCMAKE_C_FLAGS=$build_flags.CMAKE_CFLAGS",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=$build_flags.CMAKE_SHADERLINKER_FLAGS",
                        "$build_flags.CMAKE_ANDROID_STL","-DANDROID_ARM_MODE=arm","-D_FILE_OFFSET_BITS=64"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/ogg/CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}