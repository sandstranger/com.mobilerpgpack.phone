import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.library)
}
kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

android {
    namespace 'com.mobilerpgpack.fluidsynth'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(*build_flags.abi_filters)
            universalApk false
        }
    }

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        externalNativeBuild {
            cmake {
                arguments"-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DCMAKE_CXX_FLAGS=$build_flags.CMAKE_CXXFLAGS -std=c++20 -Wno-pointer-sign -Wno-error=unused-but-set-variable",
                        "-DCMAKE_C_FLAGS=$build_flags.CMAKE_CFLAGS -Wno-pointer-sign -Wno-error=unused-but-set-variable",
                        "-DCMAKE_SHARED_LINKER_FLAGS=$build_flags.CMAKE_SHADERLINKER_FLAGS",
                        "-DBUILD_SHARED_LIBS=true", "-Denable-oboe=on",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_VERBOSE_MAKEFILE=OFF", "$build_flags.CMAKE_ANDROID_STL","-DANDROID_ARM_MODE=arm",
                        "-D_FILE_OFFSET_BITS=64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/fluidsynth-android/CMakeLists.txt"
            version versions.cmake_version
        }
    }

    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                    cppFlags += build_flags.CMAKE_CXX_RELEASE_FLAGS
                    cFlags += build_flags.CMAKE_C_RELEASE_FLAGS
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.dependsOn ':third_party:oboe:build'

dependencies {
    implementation(project(":third_party:oboe"))
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}