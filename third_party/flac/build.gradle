plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.mobilerpgpack.flac'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        ndk {
            abiFilters = abi_filters
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DCMAKE_CXX_FLAGS=$build_flags.CMAKE_CXXFLAGS",
                        "-DCMAKE_C_FLAGS=$build_flags.CMAKE_CFLAGS",
                        "-DBUILD_PROGRAMS=OFF","-DBUILD_EXAMPLES=OFF",
                        "-DBUILD_TESTING=OFF", "-DBUILD_DOCS=OFF",
                        "-DWITH_STACK_PROTECTOR=OFF","-DINSTALL_MANPAGES=OFF",
                        "-DINSTALL_PKGCONFIG_MODULES=OFF","-DINSTALL_CMAKE_CONFIG_MODULE=OFF",
                        "-DWITH_OGG=ON","-DBUILD_SHARED_LIBS=ON",
                        "-DENABLE_MULTITHREADING=ON",
                        "-DBUILD_CXXLIBS=OFF",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=$build_flags.CMAKE_SHADERLINKER_FLAGS",
                        "$build_flags.CMAKE_ANDROID_STL","-DANDROID_ARM_MODE=arm","-D_FILE_OFFSET_BITS=64"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version

    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.dependsOn ':third_party:libvorbis:build'

dependencies {
    implementation(project(":third_party:libvorbis"))
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}