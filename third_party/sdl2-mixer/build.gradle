import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.library)
}
kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

android {
    namespace 'com.mobilerpgpack.sdl2_mixer'
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(*build_flags.abi_filters)
            universalApk false
        }
    }

    defaultConfig {
        targetSdk versions.target_sdk
        minSdk versions.min_sdk

        externalNativeBuild {
            ndkBuild {
                arguments += build_flags.ndk_build_platform
                arguments += build_flags.compiling_arguments
                arguments += build_flags.ndk_build_flags
                arguments += build_flags.ndk_build_android_stl
                cFlags  += build_flags.common_c_flags
                cppFlags += build_flags.common_cpp_flags
            }
        }
    }
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/SDL_mixer/Android.mk'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            externalNativeBuild {
                ndkBuild {
                    cppFlags += build_flags.ndk_build_release_cpp_flags
                    cFlags += build_flags.ndk_build_release_c_flags
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
}

preBuild.dependsOn ':third_party:sdl2-compat:build', ':third_party:mpg123:build'

dependencies {
    implementation(project(":third_party:sdl2-compat"))
    implementation(project(":third_party:mpg123"))
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}